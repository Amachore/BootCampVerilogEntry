# Tiny Tapeout project information
project:
  title:        "PixelSeasons"      # Project title
  author:       "Vaughn Uriel Balane"      # Your name
  discord:      "vaughnnyy."      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "It's a seasonal animation taht includes effects and sprites at the end (Mario's controllable here)."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 25175000     # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_vga_seasons"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "hsync_generator.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
# Inputs
  ui[0]: "Season Sel 0 / D-Pad Up"
  ui[1]: "Season Sel 1 / D-Pad Down"
  ui[2]: "Animate Toggle / D-Pad Left"
  ui[3]: "UFO Mode / D-Pad Right"
  ui[4]: "Volcano Eruption"
  ui[5]: "Thunderstorm"
  ui[6]: "Earthquake"
  ui[7]: "Mascots / Game Mode"

  # Outputs
  uo[0]: "VGA Red Bit 0"
  uo[1]: "VGA Green Bit 0"
  uo[2]: "VGA Blue Bit 0"
  uo[3]: "VGA H-Sync"
  uo[4]: "VGA V-Sync"
  uo[5]: "VGA Red Bit 1"
  uo[6]: "VGA Green Bit 1"
  uo[7]: "VGA Blue Bit 1"

  # Bidirectional pins
  uio[0]: "Audio Out"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
